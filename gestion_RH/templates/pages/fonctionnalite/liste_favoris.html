{% extends "../../base.html" %}
{% block title %}
liste favoris
{% endblock %}

{% block content %}
<h1>Liste des Favoris</h1>
<ul>
    {% for favori in favoris %}
        <li>
            {{ favori.code_fonctionnalite.name_Fonctionnalite }}
            <form method="post" action="{% url 'supprimerDesFavoris' favori.code_fonctionnalite.id %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Remove</button>
            </form>
        </li>
    {% endfor %}
</ul>
{% endblock %}
