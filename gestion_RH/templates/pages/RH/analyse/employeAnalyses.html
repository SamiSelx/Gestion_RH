{% extends "../../../base.html" %}
{% load static %}
{% block title %}
Employe Analyses
{% endblock %}


{% block content %}
<div class="analysis container mx-auto">
    <h1>Employee Analysis</h1>

    <div class=" gap-5 text-center">
            <div class="row mb-5">
                <div class="col" style="width: 500px; height: 500px;">
                    <canvas id="genderDiversityChart"></canvas>
                </div>
                <div class="col" style="width: 500px; height: 500px;">
                    <h2>Répartition par Âge</h2>
                    <canvas id="ageChart" width="400" height="200"></canvas>
                </div>
            </div>

            <div class="row">
                <div class="col" style="width: 500px; height: 500px;">
                    <h2>Répartition par Ancienneté</h2>
                    <canvas id="seniorityChart" width="400" height="200"></canvas>
                </div>
                <div class="col" style="width: 500px; height: 500px;">
                    <h3>Répartition nombre d'employé par contrat</h3>
                    <canvas id="contractChart" width="400" height="200"></canvas>
                </div>
            </div>
    </div>

    <script type="text/javascript">
        var ctx = document.getElementById('genderDiversityChart').getContext('2d');
        var genderData = JSON.parse('{{ context.diversity_gender|escapejs }}');
        var genderChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: genderData.map(item => item.gender),
                datasets: [{
                    label: 'Gender Diversity',
                    data: genderData.map(item => item.count),
                }]
            }
        });

        var contractData = JSON.parse('{{ context.contract_data|escapejs }}');


        var labels = contractData.map(item => item.type_contrat);
        var data = contractData.map(item => item.count);

        var ctx = document.getElementById('contractChart').getContext('2d');
        var contractChart = new Chart(ctx, {
            type: 'bar', 
            data: {
                labels: labels, 
                datasets: [{
                    label: 'Nombre des employés',
                    data: data, 
                    backgroundColor: [
                        'rgba(75, 192, 192, 0.2)',
                        'rgba(255, 99, 132, 0.2)',
                        'rgba(255, 206, 86, 0.2)'
                    ],
                    borderColor: [
                        'rgba(75, 192, 192, 1)',
                        'rgba(255, 99, 132, 1)',
                        'rgba(255, 206, 86, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    title: {
                        display: true,
                        text: "Nombre d'employe par Contrat"
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1, 
                            callback: function (value) {
                                if (Number.isInteger(value)) {
                                    return value; 
                                }
                            }
                        }
                    }
                }
            }
        });

        let ageData = JSON.parse('{{ context.age_distribution|escapejs }}');
        let seniorityData = JSON.parse('{{ context.seniority_distribution|escapejs }}');
        // Age Chart
        let ageLabels = ageData.map(item => item.range);
        let ageCounts = ageData.map(item => item.count);

        let ageCtx = document.getElementById('ageChart').getContext('2d');
        new Chart(ageCtx, {
            type: 'bar',
            data: {
                labels: ageLabels,
                datasets: [{
                    label: 'Nombre des employés',
                    data: ageCounts,
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1,
                            callback: value => (Number.isInteger(value) ? value : null)
                        }
                    }
                }
            }
        });

        // Ancienneté Chart
        let seniorityLabels = seniorityData.map(item => item.range);
        let seniorityCounts = seniorityData.map(item => item.count);

        let seniorityCtx = document.getElementById('seniorityChart').getContext('2d');
        new Chart(seniorityCtx, {
            type: 'bar',
            data: {
                labels: seniorityLabels,
                datasets: [{
                    label: 'Nombre des employés',
                    data: seniorityCounts,
                    backgroundColor: 'rgba(153, 102, 255, 0.2)',
                    borderColor: 'rgba(153, 102, 255, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1,
                            callback: value => (Number.isInteger(value) ? value : null)
                        }
                    }
                }
            }
        });
    </script>

    {% endblock %}
