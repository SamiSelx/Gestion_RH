{% extends "../../../../base.html" %}

{% block title %}
Ajouter un Service
{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center mb-4">Ajouter un Service</h1>
    
    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div class="d-flex justify-content-end mt-3">
            <button type="submit" class="btn btn-outline-dark mx-2">Enregistrer</button>
            <a href="{% url 'service_list' %}" class="btn btn-outline-secondary">Retour à la liste</a>
        </div>
    </form>
</div>
{% endblock %}
