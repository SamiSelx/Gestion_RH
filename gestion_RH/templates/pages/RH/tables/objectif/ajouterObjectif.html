{% extends "../../../../base.html" %}

{% block title %}
Ajouter Objectif
{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-4">Ajouter un Objectif</h2>
    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        
        <div class="form-group mb-3">
            {{ form.as_p }}
        </div>
        
        <div class="d-flex justify-content-between">
            <a href="{% url 'listeObjectif' %}" class="btn btn-secondary">Annuler</a>
            <button type="submit" class="btn btn-primary">Ajouter</button>
        </div>
    </form>
</div>
{% endblock %}
