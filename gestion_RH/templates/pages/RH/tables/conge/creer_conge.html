{% extends "../../../../base.html" %}
{% load custom_filters %}
{% block title %}
Ajouter Congé
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Créer un Congé</h2>

    <form method="post" class="p-4 border rounded shadow-sm bg-light">
        {% csrf_token %}
        <div class="form-group mb-3">
            <label for="id_type_conge" class="form-label">Type de conge</label>
            {{ form.type_conge|add_class:"form-select" }}
        </div>

        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
    </form>

    <a href="{% url 'liste_conges' %}" class="d-block text-center mt-3 text-decoration-none">Retour à la liste des congés</a>
</div>
{% endblock %}
