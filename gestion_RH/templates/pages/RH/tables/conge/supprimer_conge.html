{% extends "../../../../base.html" %}

{% block title %}
Supprimer Congé
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4 text-danger">Supprimer le Congé</h2>
    <p class="text-center">Êtes-vous sûr de vouloir supprimer ce congé ? Cette action est irréversible.</p>
    
    <!-- Form for confirming deletion -->
    <form method="post" class="text-center">
        {% csrf_token %}
        
        <!-- Action Buttons -->
        <div class="d-flex justify-content-center gap-3 mt-4">
            <a href="{% url 'liste_conges' %}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Annuler
            </a>
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash"></i> Oui
            </button>
        </div>
    </form>
</div>
{% endblock %}
