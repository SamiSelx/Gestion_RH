{% extends "../../../../base.html" %}

{% block title %}
Modifier Congé
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Modifier le Congé</h2>
    
    <!-- Form for modifying Congé -->
    <form method="post" class="p-4 border rounded shadow-sm bg-light">
        {% csrf_token %}
        {{ form.as_p }}
        
        <!-- Submit Button -->
        <div class="d-flex justify-content-between mt-3">
            <button type="submit" class="btn btn-primary">Mettre à jour</button>
        </div>
    </form>

    <!-- Back to list link -->
    <a href="{% url 'liste_conges' %}" class="d-block text-center mt-3 text-decoration-none">Retour à la liste des congés</a>
</div>
{% endblock %}
