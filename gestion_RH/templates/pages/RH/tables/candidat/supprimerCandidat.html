{% extends "../../../../base.html" %}

{% block title %}
Supprimer Candidat
{% endblock %}

{% block content %}
<div class="container mt-5">
    <!-- Form Header -->
    <div class="alert alert-danger text-center">
        <h1 class="text-danger">Supprimer Candidat</h1>
        <p class="lead">Êtes-vous sûr de vouloir supprimer ce candidat ? Cette action est irréversible.</p>
    </div>
    
    <!-- Form -->
    <form method="post" class="card p-4 shadow-sm text-center">
        {% csrf_token %}
        
        <!-- Action Buttons -->
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'listeCandidat' %}" class="btn btn-outline-secondary mx-2">
                <i class="bi bi-x-circle"></i> Annuler
            </a>
            <input type="submit" value="Supprimer" class="btn btn-danger mx-2">
        </div>
    </form>
</div>
{% endblock %}
