{% extends "../../../../base.html" %}

{% block title %}
Supprimer l'offre
{% endblock %}

{% block content %}
<div class="container p-3 mt-4 text-primary-emphasis bg-primary-subtle border border-primary-subtle rounded-3">
    Êtes-vous sûr de vouloir supprimer cette offre ?
</div>

<form method="POST" class="container my-4">
    {% csrf_token %}
    <p>{{ offre.titre_offre }} (Service: {{ offre.code_service.description_service }})</p>
    <button type="submit" class="btn btn-danger">Supprimer</button>
    <a href="{% url 'liste_offre_employe' %}" class="btn btn-outline-dark">Cancel</a>
</form>

{% endblock %}
