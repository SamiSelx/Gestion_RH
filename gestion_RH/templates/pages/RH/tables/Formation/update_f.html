{% extends "../../../../base.html" %}

{% block title %}
Update Formation
{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-4">Mettre à jour la Formation</h2>
    
    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div class="d-flex justify-content-end mt-3">
            <button type="submit" class="btn btn-outline-dark mx-2">Sauvegarder les modifications</button>
            <a href="{% url 'ListeFormation' %}" class="btn btn-outline-secondary">Retour à la liste</a>
        </div>
    </form>
</div>
{% endblock %}
