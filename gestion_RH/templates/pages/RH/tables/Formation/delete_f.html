{% extends "../../../../base.html" %}

{% block title %}
Supprimer la Formation
{% endblock %}

{% block content %}
<div class="container mt-5">
    <!-- Form Header -->
    <div class="alert alert-danger text-center">
        <h1 class="text-danger">Supprimer la Formation</h1>
        <p class="lead">Êtes-vous sûr de vouloir supprimer cette formation ? Cette action est irréversible.</p>
        <p><strong>{{ formation.titre_formation }}</strong></p>
    </div>
    
    <!-- Form -->
    <form method="post" class="text-center">
        {% csrf_token %}
        
        <!-- Action Buttons -->
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'ListeFormation' %}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Annuler
            </a>
            <input type="submit" value="Supprimer" class="btn btn-danger">
        </div>
    </form>
</div>
{% endblock %}
