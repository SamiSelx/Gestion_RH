{% extends "../../../../base.html" %}

{% block title %}
Confirmation de Suppression
{% endblock %}

{% block content %}
<div class="container mt-5">
    <!-- Header Section -->
    <div class="alert alert-danger text-center">
        <h1 class="text-danger">Êtes-vous sûr de vouloir supprimer ?</h1>
        <p class="lead">{{ employe.nomE }} {{ employe.prenomE }}</p>
    </div>
    
    <!-- Form Section -->
    <form method="post" class="card p-4 shadow-sm text-center">
        {% csrf_token %}
        
        <!-- Action Buttons -->
        <div class="d-flex justify-content-center gap-3">
            <button type="submit" class="btn btn-danger mx-2">
                Oui, supprimer
            </button>
            <a href="{% url 'employe_list' %}" class="btn btn-outline-secondary mx-2">
                Annuler
            </a>
        </div>
    </form>
</div>
{% endblock %}
