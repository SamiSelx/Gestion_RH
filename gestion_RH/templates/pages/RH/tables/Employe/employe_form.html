{% extends "../../../../base.html" %}

{% block title %}
Formulaire Employé
{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-4">Formulaire Employé</h2>
    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        
        <div class="form-group mb-3">
            {{ form.as_p }}
        </div>
        
        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-outline-success">Save</button>
            <a href="{% url 'employe_list' %}" class="btn btn-outline-dark">Back to List</a>
        </div>
    </form>
</div>
{% endblock %}
