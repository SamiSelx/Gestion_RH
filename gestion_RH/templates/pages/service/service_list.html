{% extends "../../base.html" %}

{% block title %}
Liste des Services
{% endblock %}

{% block content %}
<div class="container p-3 mt-4 text-primary-emphasis bg-primary-subtle border border-primary-subtle rounded-3">
    Liste des Services :
</div>

<table border="1px" class="container my-4 table table-sm align-middle">
    <thead class="table-dark">
        <tr>
            <td>Description du Service</td>
            <td>Modifier</td>
            <td>Supprimer</td>
        </tr>
    </thead>

    <tbody class="table-group-divider">
        {% for service in services %}
        <tr>
            <td>{{ service.description_service }}</td>
            <td><a href="{% url 'edit_service' service.pk %}" class="btn btn-success">Modifier</a></td>
            <td><a href="{% url 'delete_service' service.pk %}" class="btn btn-danger">Supprimer</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="{% url 'add_service' %}" class="btn btn-outline-dark">Ajouter service</a>

{% endblock %}
