{% extends "../../../base.html" %}
{% block title %}Créer un Critère{% endblock %}
{% block content %}
<div class="container">
    <h1>Créer un Critère</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Créer</button>
        <a href="{% url 'list_criteres' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
