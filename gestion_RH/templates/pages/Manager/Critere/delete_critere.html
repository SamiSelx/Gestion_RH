{% extends "../../../base.html" %}
{% block title %}Supprimer un Critère{% endblock %}
{% block content %}
<div class="container">
    <h1>Supprimer le Critère</h1>
    <p>Êtes-vous sûr de vouloir supprimer ce critère ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Oui, supprimer</button>
        <a href="{% url 'list_criteres' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
