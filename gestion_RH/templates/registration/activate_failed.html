{% extends "../../base.html" %}
{% load static %}

{% block title %}
Failed
{% endblock %}

{% block side_menu %}
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg">
                <div class="card-header bg-danger text-white text-center">
                    <h3><i class="bi bi-check-circle"></i> Failed to activate Your Account {{user.username}}</h3>
                </div>
                <div class="card-body text-center">
                    <p class="lead">Failed to activate Your Account {{user.email}}, please try again.</p>
                    <a href="{% url 'register' %}" class="btn btn-primary mt-3">
                        Retour Register
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
{% endblock %}
